[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PyGSN"
version = "1.0.0"
description = "Herramienta de Transformación de Sistemas de Coordenadas y Georreferenciación de Sensores (UPV - S3)"
authors = [
    { name = "Bryan Andres Botello", email = "andreesbotello@gmail.com" }
]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "PySide6>=6.6.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
pygsn = "main:main"
